# 조직 규정 QA 챗봇 (D-69)
#
# 이 파일은 config-server가 평문으로 서빙하고, config-repo는 공개 저장소에 그대로
# 들어간다. 따라서 GEMINI_API_KEY 같은 비밀은 여기 두지 않는다. 서비스는 키를
# compose 환경변수로만 읽는다.
#
# 다른 서비스와 달리 이 서비스는 JVM이 아니라서 spring.* 설정을 쓰지 않는다.
# config-server의 REST API(GET /ai-service/default)로 이 파일을 읽어간다.
# application.yml의 공통 설정(management.*, spring.cloud.consul.*)은 Spring
# 클라이언트가 해석하는 것이므로 이 서비스에는 적용되지 않는다. 같은 동작을
# ai-service/app/consul.py 와 logging_setup.py 에서 직접 구현했다.

server:
  port: 8086

ai:
  # 버전이 고정된 GA 이름을 쓴다. gemini-flash-latest 같은 별칭은 뒤에서 모델이
  # 바뀌어 품질 측정치가 무효가 된다. gemini-2.5-* 는 신규 사용자에게 제공 종료(404).
  #
  # lite인 이유는 무료 티어 RPD다. 3.6/3.5 Flash는 RPD 20이라 평가 60문항 한 회차에
  # 3일이 걸리고, 운영으로도 하루 20요청이 상한이다. lite는 RPD 500 / RPM 15다.
  model: gemini-3.5-flash-lite

  # 프롬프트 인젝션 완화와 토큰 예산 보호를 겸한다. 요청당 입력이 17k 토큰이고
  # 무료 티어가 하루 500요청이라, 긴 입력을 반복하면 그날 할당량이 소진된다.
  max-question-chars: 500

  request-timeout-seconds: 30

  # 429 재시도 (계획서 12번). 무료 티어는 RPM 15라 동시 사용자 두세 명이면 걸린다.
  retry:
    max-attempts: 3
    initial-delay-seconds: 2

  # 런타임 청크ID 검증 가드 (계획서 11번).
  # 60문항 실측에서 인용 102건 중 1건이 존재하지 않는 청크ID였다(E025가 PAY-003-012를
  # 인용했으나 PAY-003은 청크가 9개뿐). 하루 500요청이면 하루 5건이 없는 근거를 댄다.
  guard:
    enabled: true
    # 검증 실패 시 재생성 횟수. 재생성도 실패하면 경고 문구를 붙여 전달한다.
    regenerate-attempts: 1
