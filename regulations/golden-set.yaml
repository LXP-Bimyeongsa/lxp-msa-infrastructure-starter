# 골든 QA 셋
#
# 챗봇 평가 기준이다. 규정을 고치면 여기도 같이 고친다.
#
# 측정 방법
#   출처 정확도  cited 가 source 와 일치하는가          자동
#   회피율       trap 항목에 전부 거절이 나오는가        자동
#   정답률       answer 와 생성 답이 맞는가              judge 또는 사람
#
# 질문 표현 원칙
#   규정 문구를 그대로 베끼지 않는다. 실제 사용자가 쓸 법한 구어로 쓴다.
#   문구가 겹치면 검색이 쉬워져서 실력보다 점수가 높게 나온다.

answerable:
  # --- A유형 단순 사실 조회 ---
  - id: A-01
    q: "몇 분까지 봐주나요?"
    answer: "10분. 훈련 시작 시각으로부터 10분을 초과하면 지각이다."
    source: [01-출결.md#제12조]
    type: A

  - id: A-02
    q: "노트북 얼마나 빌릴 수 있어요?"
    answer: "30일. 1회에 한해 30일 연장 가능."
    source: [04-시설-장비.md#제20조]
    type: A

  - id: A-03
    q: "훈련장려금 언제 들어와요?"
    answer: "매월 15일에 전월분 지급. 15일이 휴일이면 직전 영업일."
    source: [02-훈련장려금.md#제20조]
    type: A

  - id: A-04
    q: "주말에도 나올 수 있나요?"
    answer: "불가. 훈련장은 평일 08:00~22:00만 개방한다."
    source: [04-시설-장비.md#제10조]
    type: A

  - id: A-05
    q: "회의실 미리 얼마나 잡을 수 있어요?"
    answer: "이용일 기준 2주 전부터 예약 가능."
    source: [05-회의실.md#제11조]
    type: A

  - id: A-06
    q: "수료증 잃어버렸는데 다시 받을 수 있나요?"
    answer: "담당 매니저에게 요청하면 재발급. 5영업일 소요."
    source: [03-수료.md#제31조]
    type: A

  - id: A-07
    q: "늦게 말 안 하고 안 나오면 어떻게 되나요?"
    answer: "무단결석으로 처리되고 결석 2일로 환산된다."
    source: [01-출결.md#제21조, 01-출결.md#제22조]
    type: A

  - id: A-08
    q: "출결 잘못 찍힌 것 같은데 고칠 수 있나요?"
    answer: "발생일부터 7일 이내에 담당 매니저에게 정정 요청. 기간이 지나면 불가."
    source: [01-출결.md#제30조]
    type: A

  - id: A-09
    q: "회의실 한 번에 몇 시간까지 쓸 수 있어요?"
    answer: "최대 2시간. 더 필요하면 2시간 단위로 나눠 신청한다."
    source: [05-회의실.md#제12조]
    type: A

  - id: A-10
    q: "예약해놓고 안 가면 불이익 있나요?"
    answer: "노쇼로 기록되고 3회 누적 시 30일간 예약이 제한된다."
    source: [05-회의실.md#제13조]
    type: A

  # --- B유형 조건부·계산형 ---
  - id: B-01
    q: "3일 빠지면 장려금 얼마 받아요?"
    answer: "30% 감액되어 221,200원."
    source: [02-훈련장려금.md#제11조]
    type: B

  - id: B-02
    q: "출석률 78%인데 수료되나요?"
    answer: "바로는 미수료. 70~80% 구간이라 보충 훈련을 신청하면 수료 가능하다."
    source: [03-수료.md#제12조, 03-수료.md#제20조]
    type: B

  - id: B-03
    q: "지각을 다섯 번 했으면 결석 며칠인가요?"
    answer: "1일. 지각 3회가 결석 1일이므로 5회는 1일로 환산되고 2회가 남는다."
    source: [01-출결.md#제13조]
    type: B

  - id: B-04
    q: "닷새 결석하면 장려금 아예 안 나오나요?"
    answer: "그렇다. 5일 이상은 100% 감액으로 미지급."
    source: [02-훈련장려금.md#제11조]
    type: B

  - id: B-05
    q: "말 없이 이틀 안 나갔으면 장려금 얼마 깎여요?"
    answer: "무단결석 2일은 결석 4일로 환산되어 50% 감액. 158,000원."
    source: [02-훈련장려금.md#제12조, 02-훈련장려금.md#제11조]
    type: B

  - id: B-06
    q: "출석률 65%면 보충 들으면 되나요?"
    answer: "불가. 70% 미만은 보충 훈련 대상이 아니다."
    source: [03-수료.md#제12조]
    type: B

  - id: B-07
    q: "조퇴랑 지각 각각 세 번씩이면 결석 며칠이에요?"
    answer: "2일. 지각 3회로 1일, 조퇴 3회로 1일."
    source: [01-출결.md#제13조, 01-출결.md#제14조]
    type: B

  - id: B-08
    q: "노트북 두 번 연장할 수 있어요?"
    answer: "불가. 연장은 1회 30일까지만."
    source: [04-시설-장비.md#제20조, 04-시설-장비.md#제22조]
    type: B

# 함정 질문
#
# 규정에 없는 것을 물었을 때 "모른다"고 답하는지 잰다.
# 완전히 딴 주제가 아니라 인접 주제로 만든다. 그래야 실제 회피 능력을 잰다.
trap:
  - id: T-01
    q: "병가 내면 결석 처리되나요?"
    why: "출결 규정에 병가 조항이 없다"

  - id: T-02
    q: "진단서 내면 결석 빠지나요?"
    why: "진단서 관련 규정이 없다"

  - id: T-03
    q: "미수료하면 다음 기수 재수강할 수 있나요?"
    why: "재수강 규정이 없다"

  - id: T-04
    q: "주차 지원되나요?"
    why: "주차 규정이 없다"

  - id: T-05
    q: "점심 식대 나오나요?"
    why: "식대 규정이 없다"

  - id: T-06
    q: "장려금 소득세 얼마나 떼요?"
    why: "세금 관련 조항이 없다"

  - id: T-07
    q: "노트북 개인 용도로 써도 되나요?"
    why: "사용 범위 조항이 없다"

  - id: T-08
    q: "회의실에서 외부 손님 만나도 되나요?"
    why: "외부인 출입 조항이 없다"

  - id: T-09
    q: "수료하면 취업 연계해주나요?"
    why: "취업 지원 규정이 없다"

  - id: T-10
    q: "훈련 중에 아르바이트해도 되나요?"
    why: "겸업 조항이 없다"
