# 프론트엔드 세 벌 (D-65, 정리는 D-66, 튜터 콘솔은 AI-08)
#
#   docker compose -f compose.demo.yaml up -d
#   → http://localhost:8091   데모 콘솔 (사가를 한 스텝씩 돌리는 시연용)
#   → http://localhost:8092   LXP 웹 클라이언트 (실제 사용자가 보는 화면)
#   → http://localhost:8093   튜터 콘솔 (AI 튜터 응답을 보는 개발용. 호스트의 8086 에 붙는다)
#
# 소스는 frontend/ 아래에 있다. infrastructure/ 는 인프라 설정 자리이지
# 애플리케이션 코드 자리가 아니다.
#
# 별도 파일로 두는 이유 — 발표·시연할 때만 필요하다. compose.yaml에 넣으면
# 평소 개발에서도 계속 떠 있게 된다(D-14의 프로파일 분리, D-56의 k6와 같은 판단).
#
# 정적 파일 한 장이라 빌드 도구가 없다. 프레임워크를 쓰면 node_modules와
# 빌드 단계가 붙는데, 이 화면의 목적은 "클릭할 것"을 만드는 것이지
# 프론트엔드를 보여주는 것이 아니다.

services:

  demo-console:
    image: nginx:1.27-alpine
    container_name: lxp-demo-console
    volumes:
      - ./frontend/demo-console:/usr/share/nginx/html:ro
    ports:
      # gateway의 CORS 허용 출처와 반드시 같아야 한다.
      # 다르면 preflight에서 막혀 화면이 아무것도 못 한다.
      - "8091:80"
    networks: [lxp-net]

  # LXP 웹 클라이언트 — 아키텍처의 client 노드.
  # apiBase(=gateway :8080)·Keycloak(:8180) 주소가 번들 안에 기본값으로 박혀 있어,
  # 이 origin(:8092)만 gateway CORS에 등록되면 바로 백엔드에 붙는다.
  lxp-client:
    image: nginx:1.27-alpine
    container_name: lxp-client
    volumes:
      - ./frontend/client:/usr/share/nginx/html:ro
    ports:
      # config-repo/gateway.yml 의 LXP_CLIENT_ORIGIN 허용 출처와 반드시 같아야 한다.
      - "8092:80"
    networks: [lxp-net]

  # 튜터 테스트 콘솔 (계획: ai-service/docs/2026-08-20-테스트-콘솔-계획.md).
  #
  # 앞의 둘과 다른 점이 하나 있다. 백엔드 컨테이너가 아니라 호스트에 붙는다.
  # 튜터(ai-service/)는 아직 compose 에 없고 uv run uvicorn 으로 뜬다(AI-02).
  #
  # nginx 를 끼우는 이유는 정적 파일 서빙이 아니라 같은 출처를 만드는 것이다.
  # ai-service 는 CORS 를 안 열기로 했는데(app/main.py), X-Member-Id 가 커스텀
  # 헤더라 브라우저가 preflight 를 보내고 서버는 405 를 준다. 같은 출처면
  # preflight 자체가 생기지 않아 그 결정을 그대로 둘 수 있다.
  # 통합 콘솔 — 커리큘럼·튜터·강의·계정을 한 화면에서 시연한다.
  # 백엔드 넷을 이 nginx 가 프록시해서 CORS 를 없앤다. 화면에는 주소 설정이 없다.
  console:
    image: nginx:1.27-alpine
    container_name: lxp-console
    volumes:
      - ./frontend/console:/usr/share/nginx/html:ro
      - ./frontend/console/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 8093 튜터 콘솔 다음 번호.
      - "8094:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # lxp-net 에 안 붙인다. 호스트 포트로만 나가므로 백엔드가 없어도 단독으로 뜬다.

  tutor-console:
    image: nginx:1.27-alpine
    container_name: lxp-tutor-console
    volumes:
      - ./frontend/tutor-console:/usr/share/nginx/html:ro
      - ./frontend/tutor-console/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 8091 데모 콘솔, 8092 웹 클라이언트 다음 번호.
      # 게이트웨이를 안 거치므로 gateway.yml 의 허용 출처에는 넣지 않는다.
      - "8093:80"
    extra_hosts:
      # Docker Desktop 은 없어도 되지만 리눅스에서는 이게 없으면 502 다.
      # 컨테이너 안에서 localhost 는 컨테이너 자신이다
      - "host.docker.internal:host-gateway"
    # lxp-net 에 붙이지 않는다. 이 화면은 호스트의 8086 으로 나갈 뿐이라
    # 백엔드 스택이 안 떠 있어도 단독으로 뜬다

networks:
  lxp-net:
    name: lxp-net
    external: true
