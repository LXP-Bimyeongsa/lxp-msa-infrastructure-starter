# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# .coderabbit.yaml — PR 자동 리뷰 규칙
#
# 이 파일의 역할: CodeRabbit이 이 저장소의 PR을 어떤 기준으로 볼지 정한다.
# → 저장소 루트에만 둘 수 있다. 하위 폴더에 두면 읽지 않는다
# → PR의 head 브랜치 기준으로 읽힌다. 같은 PR 안에서 수정하면 바로 반영된다
# 확인: PR에 `@coderabbitai configuration` 코멘트 → 해석된 설정이 출처와 함께 돌아온다

language: "ko-KR"

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true

  # 추적되지만 사람이 읽을 일이 없는 파일. 리뷰 대상에서 뺀다
  path_filters:
    - "!**/uv.lock"
    - "!**/gradle/wrapper/**"

  auto_review:
    enabled: true
    drafts: false
    # 기본 브랜치 외 PR도 빠뜨리지 않도록 설정
    base_branches:
      - ".*"

  tools:
    # ruff는 `enabled` 만 받는다. config_file 은 스키마에 없어 무시된다 —
    # 규칙은 ai-service/pyproject.toml 의 [tool.ruff] 에서 고정한다
    ruff:
      enabled: true

  path_instructions:
    - path: "ai-service/**"
      instructions: |
        - 정상 흐름만 확인하지 말고 실패, 경계값, 중단 후 재실행 반례를 제시한다.
        - 변경에서 재현 가능한 구체적 반례를 최대 3개 제시한다.
        - data/raw 산출물은 .gitignore 로 diff 에 안 보인다. 산출물 대신 생성 스크립트와
          재현 절차가 같은 PR 에 함께 커밋됐는지 확인한다.
        - restricted 콘텐츠가 검색 또는 응답으로 노출될 가능성을 우선 검토한다.
        - health/readiness는 디렉터리 존재가 아닌 실제 사용 가능 상태인지 확인한다.
        - X-Member-Id를 엔드포인트에서 직접 읽는 코드를 지적한다.

chat:
  auto_reply: true
