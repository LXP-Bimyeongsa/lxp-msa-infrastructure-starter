<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커리큘럼 로드맵</title>
<style>
  :root {
    --bg:#ffffff; --soft:#f6f7f9; --line:#e4e7ec; --line2:#d3d8e0;
    --text:#16191d; --dim:#69707d;
    --blue:#2563eb; --blue-dark:#1d4ed8; --blue-soft:#eff4ff;
    --ok:#16a34a; --warn:#c2740a; --err:#dc2626;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:16px/1.65 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}

  header{padding:20px 28px;border-bottom:1px solid var(--line)}
  header .bar{display:flex;align-items:center;gap:16px}
  header h1{margin:0;font-size:20px;letter-spacing:-.01em}
  .badge{margin-left:auto;flex:none;font-family:var(--mono);font-size:12.5px;
         color:var(--dim);background:var(--soft);border:1px solid var(--line);
         border-radius:999px;padding:5px 12px;white-space:nowrap}
  header p{margin:4px 0 0;color:var(--dim);font-size:14.5px}

  main{display:grid;grid-template-columns:400px 1fr;gap:0;
       height:calc(100vh - 86px)}
  @media (max-width:1000px){main{grid-template-columns:1fr;height:auto}}
  .pane{overflow-y:auto;padding:24px 28px}
  .pane.left{border-right:1px solid var(--line);background:var(--soft)}

  label{display:block;font-size:14.5px;font-weight:600;margin:20px 0 7px}
  label:first-of-type{margin-top:0}
  .hint{font-weight:400;color:var(--dim);font-size:13.5px;margin-left:6px}

  input,select{width:100%;padding:12px 13px;border-radius:9px;
      border:1px solid var(--line2);background:#fff;color:var(--text);
      font:15.5px/1.4 inherit}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px;
      border-color:var(--blue)}
  input::placeholder{color:#9aa1ad}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .total{margin-top:18px;padding:13px 15px;border-radius:9px;
         background:var(--blue-soft);border:1px solid #d3e0fd;font-size:14.5px}
  .total b{font-size:17px}

  button.go{width:100%;margin-top:18px;padding:15px;border:0;border-radius:9px;
     background:var(--blue);color:#fff;font:700 16.5px/1 inherit;cursor:pointer}
  button.go:hover{background:var(--blue-dark)}
  button.go:disabled{background:#a9c1f5;cursor:not-allowed}

  /* 오른쪽 */
  .placeholder{color:var(--dim);font-size:15px;padding:60px 0;text-align:center}

  .steps{margin-bottom:22px}
  .step{display:flex;align-items:flex-start;gap:11px;padding:9px 0;font-size:15px}
  .step .mark{width:20px;height:20px;border-radius:50%;flex:none;margin-top:2px;
              border:2px solid var(--line2);background:#fff}
  .step.now .mark{border-color:var(--blue);background:var(--blue);
                  animation:blink 1.1s ease-in-out infinite}
  .step.done .mark{border-color:var(--ok);background:var(--ok)}
  .step.redo .mark{border-color:var(--warn);background:var(--warn)}
  .step.now span{color:var(--blue);font-weight:600}
  .step.redo span{color:var(--warn)}
  .step .sub{display:block;color:var(--dim);font-size:13.5px;font-weight:400}
  @keyframes blink{50%{opacity:.3}}

  .summary{border:1px solid var(--line);border-radius:11px;padding:18px 20px;
           margin-bottom:18px}
  .summary .goal{font-size:17px;font-weight:600;margin-bottom:12px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13.5px;background:var(--soft);border:1px solid var(--line);
        border-radius:999px;padding:5px 12px;color:var(--dim)}
  .chip b{color:var(--text)}

  .week{border:1px solid var(--line);border-radius:11px;padding:15px 18px;margin-bottom:11px}
  .week .wh{display:flex;align-items:baseline;margin-bottom:9px}
  .week .wh .n{font-size:15px;font-weight:700;color:var(--blue)}
  .week .wh .t{margin-left:auto;font-size:13.5px;color:var(--dim)}
  .slot{display:flex;gap:12px;padding:4px 0;font-size:15px}
  .slot .hrs{flex:none;width:88px;color:var(--dim);font-size:13.5px;
             font-variant-numeric:tabular-nums}
  .reason{padding:3px 0 6px 100px;color:var(--dim);font-size:13.5px;line-height:1.55}

  .alert{border-radius:11px;padding:15px 18px;margin-bottom:18px;font-size:14.5px}
  .alert.bad{border:1px solid #f4c4c4;background:#fef4f4;color:#a01c1c}
  .alert.soft{border:1px solid var(--line);background:var(--soft);color:var(--dim)}
  .alert .t{font-weight:700;margin-bottom:4px}

  details{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
  summary{cursor:pointer;color:var(--dim);font-size:13.5px}
  .log{margin-top:10px;border:1px solid var(--line);border-radius:9px;
       background:var(--soft);padding:12px;font-family:var(--mono);font-size:11.5px;
       color:#4b5563;max-height:260px;overflow:auto;white-space:pre-wrap;
       word-break:break-all}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div>
      <h1>커리큘럼 로드맵</h1>
      <p>목표를 알려주시면 지금 있는 강의로 학습 순서를 짜드려요.</p>
    </div>
    <span class="badge" id="model" title="이 결과를 만든 모델">…</span>
  </div>
</header>

<main>
  <section class="pane left">
    <label for="goal">무엇을 배우고 싶으세요?</label>
    <input id="goal" type="text" autocomplete="off"
           placeholder="예) 백엔드 개발자가 되고 싶어요">

    <div class="two">
      <div>
        <label for="weeks">기간</label>
        <select id="weeks">
          <option value="2">2주</option>
          <option value="4">4주</option>
          <option value="8" selected>8주</option>
          <option value="12">12주</option>
          <option value="26">26주</option>
        </select>
      </div>
      <div>
        <label for="hpw">일주일에</label>
        <select id="hpw">
          <option value="5">5시간</option>
          <option value="10">10시간</option>
          <option value="15" selected>15시간</option>
          <option value="20">20시간</option>
        </select>
      </div>
    </div>

    <label for="level">지금 어느 정도 아세요?</label>
    <select id="level">
      <option value="1" selected>처음이에요</option>
      <option value="2">기초는 알아요</option>
      <option value="3">실무를 조금 해봤어요</option>
      <option value="4">혼자 만들어봤어요</option>
      <option value="5">깊이 파고 싶어요</option>
    </select>

    <div class="total">총 <b id="total">120</b>시간이에요.</div>
    <button class="go" id="go">학습 경로 만들기</button>
  </section>

  <section class="pane right">
    <div id="steps" class="steps" hidden></div>
    <div id="out">
      <div class="placeholder">배우고 싶은 것을 적고 버튼을 눌러 보세요.</div>
    </div>
    <details id="devbox" hidden>
      <summary>서버가 보낸 원본 기록</summary>
      <div class="log" id="log"></div>
    </details>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function total(){ $('total').textContent = (+$('weeks').value) * (+$('hpw').value); }
['weeks','hpw'].forEach(id => $(id).addEventListener('change', total));
total();

fetch('/actuator/health').then(r => r.json())
  .then(d => { $('model').textContent = d.model; })
  .catch(() => { $('model').textContent = '모델 확인 실패'; });

$('goal').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

// 진행 단계 --------------------------------------------------
// 사용자가 읽을 말로 쓴다. generate·verify 같은 내부 이름은 아래 접힌 칸에만 둔다.
let steps = [];
function resetSteps(){ steps = []; $('steps').innerHTML = ''; $('steps').hidden = false; }

function addStep(text, sub, cls){
  const prev = steps[steps.length - 1];
  if (prev && prev.classList.contains('now')) {
    prev.classList.remove('now');
    if (!prev.classList.contains('redo')) prev.classList.add('done');
  }
  const el = document.createElement('div');
  el.className = 'step ' + (cls || 'now');
  el.innerHTML = '<span class="mark"></span><span>' + esc(text)
    + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</span>';
  $('steps').appendChild(el);
  steps.push(el);
  return el;
}
function finishSteps(){
  const last = steps[steps.length - 1];
  if (last && last.classList.contains('now')) {
    last.classList.remove('now'); last.classList.add('done');
  }
}
function log(ev, data){
  $('devbox').hidden = false;
  $('log').textContent += 'event: ' + ev + '\n' + JSON.stringify(data) + '\n\n';
  $('log').scrollTop = $('log').scrollHeight;
}

// 결과 ------------------------------------------------------
function render(d){
  const parts = [];

  if (!d.weeks.length) {
    parts.push('<div class="alert soft"><div class="t">맞는 강의를 못 찾았어요</div>'
      + '지금 있는 강의 중에는 이 목표에 맞는 것이 없어요. '
      + '억지로 채우지 않고 비워 두었어요.</div>');
  }
  if (d.problems && d.problems.length) {
    parts.push('<div class="alert bad"><div class="t">다듬지 못한 곳이 있어요</div>'
      + d.problems.map(esc).join('<br>') + '</div>');
  }

  if (d.goalSummary || d.courses.length) {
    parts.push('<div class="summary"><div class="goal">' + esc(d.goalSummary || '') + '</div>'
      + '<div class="chips">'
      + '<span class="chip">강의 <b>' + d.courses.length + '</b>개</span>'
      + '<span class="chip">총 <b>' + d.totalHours + '</b>시간</span>'
      + '<span class="chip"><b>' + d.weekCount + '</b>주 계획</span>'
      + '</div></div>');
  }

  const why = {};
  d.courses.forEach(c => { why[c.title] = c.reason; });
  const shown = new Set();
  d.weeks.forEach(w => {
    const slots = w.slots.map(s => {
      const span = s.hours === s.totalHours
        ? s.hours + '시간'
        : s.hours + '시간 / ' + s.totalHours + '시간 중';
      let row = '<div class="slot"><span class="hrs">' + span + '</span><span>'
        + esc(s.title) + '</span></div>';
      if (why[s.title] && !shown.has(s.title)) {
        shown.add(s.title);
        row += '<div class="reason">' + esc(why[s.title]) + '</div>';
      }
      return row;
    }).join('');
    parts.push('<div class="week"><div class="wh"><span class="n">' + w.week + '주차</span>'
      + '<span class="t">' + w.hours + '시간</span></div>' + slots + '</div>');
  });

  $('out').innerHTML = parts.join('');
}

function fail(title, body){
  finishSteps();
  $('out').innerHTML = '<div class="alert bad"><div class="t">' + esc(title) + '</div>'
    + esc(body) + '</div>';
}

// 실행 ------------------------------------------------------
$('go').onclick = async () => {
  const goal = $('goal').value.trim();
  if (!goal) { $('goal').focus(); return; }

  $('go').disabled = true;
  resetSteps();
  $('log').textContent = ''; $('devbox').hidden = true;
  $('out').innerHTML = '';
  let picking = null, budgetHours = 0;

  try {
    // EventSource 는 GET 만 되어서 POST 로 흘려받으려면 이렇게 씁니다.
    const res = await fetch('/api/ai/curriculum/roadmap/stream', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({goal: goal, weeks: +$('weeks').value,
                            hoursPerWeek: +$('hpw').value, level: +$('level').value})
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({detail: res.statusText}));
      fail('지금은 만들 수 없어요', e.detail);
      $('go').disabled = false; return;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', done = false;
    for (;;) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buf += dec.decode(chunk.value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const evm = block.match(/^event: (.+)$/m);
        const dam = block.match(/^data: (.+)$/m);
        if (!evm || !dam) continue;
        const ev = evm[1], d = JSON.parse(dam[1]);
        log(ev, ev === 'result' ? {courses: d.courses.length, weeks: d.weekCount} : d);

        if (ev === 'start') {
          budgetHours = d.budgetHours;
          addStep('목표를 읽었어요', '강의 ' + d.catalog + '개 중에서 골라요', 'done');
        } else if (ev === 'generate') {
          picking = addStep(
            d.attempt === 1 ? '강의를 고르는 중이에요' : '다시 고르는 중이에요',
            d.attempt === 1 ? null : d.attempt + '번째 시도예요');
        } else if (ev === 'verify') {
          if (d.ok) {
            addStep('일정이 맞는지 확인했어요', d.selected + '개 · ' + d.total_hours + '시간', 'done');
          } else {
            if (picking) { picking.classList.remove('now'); picking.classList.add('done'); }
            // 서버가 준 문장은 개발자용이라(예: "기간 초과: 40h > 20h") 그대로 안 보여준다.
            // 숫자를 받아 다시 쓴다. 원문은 아래 접힌 칸에 남는다.
            const over = budgetHours && d.total_hours > budgetHours;
            addStep(over ? '시간이 넘어서 다시 골라요' : '순서가 맞지 않아 다시 골라요',
                    over ? d.total_hours + '시간이라 ' + budgetHours + '시간을 넘어요'
                         : '고른 강의를 다시 맞춰요',
                    'redo');
          }
        } else if (ev === 'schedule') {
          addStep('주차별로 나눴어요', d.week_count + '주 계획', 'done');
        } else if (ev === 'result') {
          done = true;
          if (d.model) $('model').textContent = d.model;
          finishSteps();
          render(d);
        } else if (ev === 'error') {
          done = true;
          fail(d.status === 429 ? '오늘 쓸 수 있는 횟수를 다 썼어요'
                                : '만드는 중에 문제가 생겼어요',
               d.status === 429 ? '잠시 뒤에 다시 눌러 주세요.' : d.detail);
        }
      }
    }
    if (!done) fail('중간에 연결이 끊겼어요', '다시 한 번 눌러 주세요.');
  } catch (e) {
    fail('연결하지 못했어요', String(e));
  }
  $('go').disabled = false;
};
</script>
</body>
</html>
