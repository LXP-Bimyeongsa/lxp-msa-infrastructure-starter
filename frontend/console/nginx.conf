# 통합 콘솔 프록시
#
# 화면 하나에서 백엔드 넷을 부른다. 전부 이 오리진을 거치게 해서 CORS 를 없앤다.
# 화면이 :8094 인데 모델 서비스가 :8086 이면 브라우저가 교차 출처로 막고,
# 그러면 서비스마다 허용 출처를 등록해야 한다. 여기서 한 번에 끝낸다.
#
# location 은 긴 접두사가 먼저 잡힌다. /api/ai/curriculum 을 /api/ai 보다
# 위에 둔 것은 읽는 사람을 위한 것이고, 순서가 아니라 길이가 판정 기준이다.

server {
    listen       80;
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # 화면
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # 커리큘럼 로드맵 (compose.curriculum.yaml 로 따로 띄운다)
    location /api/ai/curriculum/ {
        proxy_pass http://host.docker.internal:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # SSE. 버퍼링을 끄지 않으면 단계가 다 끝난 뒤 한꺼번에 몰려 나온다.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 조직 규정 QA 챗봇 (org-qa-chatbot/ai-service)
    #
    # 튜터와 경로가 /api/ai/chat 으로 같고 포트도 둘 다 8086 을 기본으로 쓴다.
    # 같이 띄우려면 하나를 옮겨야 해서 규정 챗봇을 8088 로 돌린다.
    # 화면에서는 /api/regs/chat 으로 부르고 여기서 원래 경로로 바꿔 보낸다.
    location = /api/regs/chat {
        proxy_pass http://host.docker.internal:8088/api/ai/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 토큰 단위로 흘러온다. 버퍼링을 끄지 않으면 다 끝난 뒤 한꺼번에 나온다.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # AI 튜터 (ai-service)
    location /api/ai/ {
        proxy_pass http://host.docker.internal:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 도메인 서비스는 게이트웨이를 거친다
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # Keycloak 토큰 발급
    location /realms/ {
        proxy_pass http://host.docker.internal:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # 상태 표시줄이 부른다. 백엔드가 죽었을 때 502 가 빨리 돌아와야
    # 화면이 오래 기다리지 않는다.
    location = /up/curriculum {
        proxy_pass http://host.docker.internal:8087/actuator/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location = /up/tutor {
        proxy_pass http://host.docker.internal:8086/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location = /up/regs {
        proxy_pass http://host.docker.internal:8088/actuator/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location = /up/gateway {
        proxy_pass http://host.docker.internal:8080/actuator/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
}
