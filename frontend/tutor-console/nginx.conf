# frontend/tutor-console/nginx.conf: 정적 파일과 튜터 API 를 같은 출처로 묶는다
#
# 이 파일의 역할: 8093 한 출처 안에서 화면과 /api/ai 를 함께 낸다.
# → compose.demo.yaml 의 tutor-console 서비스가 default.conf 자리에 마운트한다
# 확인: http://localhost:8093/health 가 {"project":"lxp-ai-tutor"} 를 돌려준다
#
# 왜 프록시인가. ai-service 는 CORS 를 열지 않는다(app/main.py). 게이트웨이 뒤에 설
# 서비스라서 그렇고 그 판단은 그대로 둔다. 그런데 X-Member-Id 는 커스텀 헤더라
# 브라우저가 preflight(OPTIONS)를 보내고 서버는 405 를 돌려준다. 화면이 요청을
# 하나도 못 보낸다. 같은 출처로 만들면 preflight 자체가 생기지 않는다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 튜터는 컨테이너가 아니라 호스트에서 uv run uvicorn 으로 뜬다.
    # 여기에 localhost 를 적으면 컨테이너 자신을 가리켜 502 가 난다
    location /api/ai/ {
        proxy_pass http://host.docker.internal:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 스트리밍이 없어 응답 하나를 통째로 기다린다. 기본 60초로는
        # 색인 직후 첫 질문이 끊길 수 있다
        proxy_read_timeout 120s;
    }

    # 콘솔이 붙은 상대가 튜터가 맞는지 확인하는 경로다.
    # /api/ai 아래가 아니므로 따로 넘긴다
    location /health {
        proxy_pass http://host.docker.internal:8086;
        proxy_set_header Host $host;
    }
}
